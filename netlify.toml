# Settings in the [build] context are global and are applied to all contexts
# unless otherwise overridden by more specific contexts.
[build]
# Directory to change to before starting a build.
# This is where we will look for package.json/.nvmrc/etc.
base = "/"

# Directory that contains the deploy-ready HTML files and assets generated by
# the build. This is relative to the base directory if one has been set, or the
# root directory if a base has not been set. This sample publishes the
# directory located at the absolute path "root/project/build-output"
publish = "public/"

# Default build command.
#
# Trailing `find` is a workaround for the legacy @netlify/plugin-gatsby build
# plugin (installed from the Netlify UI, so it cannot be disabled from here).
# Its onPostBuild copies .cache/ into the build cache with `cpy`, which crashes
# with EISDIR on the bin symlinks that gatsby-adapter-netlify writes under
# .cache/adapters/ -- both at the top level and nested inside transitive deps
# (e.g. node_modules/builtins/node_modules/.bin/semver), hence the recursive
# sweep. Those are npm install-script shims, unused at runtime and by function
# bundling, so dropping them is safe. `|| true` keeps a failed sweep from
# failing the deploy; a failed build still propagates through the `&&`.
# Remove this once the plugin is uninstalled -- Gatsby 5.12+ handles Netlify
# natively via the adapter.
command = "yarn run server-build && (find .cache -type d -name .bin -prune -exec rm -rf {} + || true)"

# Command Increase Max Processing Space
# command = "node --max_old_space_size=4096 ./node_modules/.bin/gatsby build"

[build.environment]

GIT_LFS_ENABLED = "true"
GIT_LFS_FETCH_INCLUDE = "true"
NODE_OPTIONS = "--max-old-space-size=4096"
NODE_VERSION = "lts/*"

[build.processing.html]
pretty_urls = true

#[[plugins]]
#package = "netlify-plugin-gatsby-cache"

# [[plugins]]
# package = "netlify-plugin-image-optim"

# [[plugins]]
# package = "netlify-plugin-is-website-vulnerable"
# BUG DETECTED

[[plugins]]
package = "netlify-plugin-submit-sitemap"

[plugins.inputs]

# Path to the sitemap URL (optional, default = /sitemap.xml)
sitemapPath = "/sitemap.xml"

# Enabled providers to submit sitemap to (optional, default = 'google', 'bing'). Possible providers are currently only 'google' and 'bing'.
providers = [
  "google",
  "bing",
]
